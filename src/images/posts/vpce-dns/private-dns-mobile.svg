<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1072" role="img" aria-labelledby="title desc">
  <title id="title">Secrets Manager DNS before and after Private DNS</title>
  <desc id="desc">An EC2 instance looks up secretsmanager.us-east-1.amazonaws.com. With Private DNS off, its VPC resolver returns a public service address. With Private DNS on, it returns private interface endpoint ENI addresses, illustrated as 10.0.2.14 and 10.0.3.21.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 22 22" markerWidth="22" markerHeight="22" refX="20" refY="11" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 2 20 11 2 20Z" fill="#374151" />
    </marker>
  </defs>

  <rect width="600" height="1072" fill="#fff" />
  <text x="24" y="48" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700">Same hostname, new answer</text>
  <text x="24" y="81" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="22">One EC2 instance makes the same lookup.</text>
  <rect x="24" y="107" width="552" height="77" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5" />
  <text x="45" y="139" fill="#111827" font-family="Menlo, Consolas, monospace" font-size="23">secretsmanager.us-east-1</text>
  <text x="45" y="168" fill="#111827" font-family="Menlo, Consolas, monospace" font-size="23">.amazonaws.com</text>

  <rect x="24" y="207" width="552" height="385" rx="8" fill="#fff" stroke="#6b7280" stroke-width="1.7" />
  <text x="48" y="245" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700">Private DNS off</text>
  <path d="M24 260H576" stroke="#9ca3af" stroke-width="1.5" />
  <rect x="48" y="275" width="504" height="42" rx="5" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.3" />
  <text x="300" y="303" text-anchor="middle" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="25">EC2 client</text>
  <path d="M300 321V384" fill="none" stroke="#374151" stroke-width="3.8" marker-end="url(#arrow)" />
  <rect x="48" y="392" width="504" height="42" rx="5" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.3" />
  <text x="300" y="420" text-anchor="middle" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="25">VPC resolver</text>
  <path d="M300 438V501" fill="none" stroke="#374151" stroke-width="3.8" marker-end="url(#arrow)" />
  <rect x="48" y="509" width="504" height="66" rx="5" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5" />
  <text x="300" y="539" text-anchor="middle" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">Public service address</text>
  <text x="300" y="564" text-anchor="middle" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="21">Normal public DNS answer</text>

  <rect x="24" y="608" width="552" height="385" rx="8" fill="#fff" stroke="#6b7280" stroke-width="1.7" />
  <text x="48" y="646" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700">Private DNS on</text>
  <path d="M24 661H576" stroke="#9ca3af" stroke-width="1.5" />
  <rect x="48" y="676" width="504" height="42" rx="5" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.3" />
  <text x="300" y="704" text-anchor="middle" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="25">EC2 client</text>
  <path d="M300 722V785" fill="none" stroke="#374151" stroke-width="3.8" marker-end="url(#arrow)" />
  <rect x="48" y="793" width="504" height="42" rx="5" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.3" />
  <text x="300" y="821" text-anchor="middle" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="25">VPC resolver</text>
  <path d="M300 839V902" fill="none" stroke="#374151" stroke-width="3.8" marker-end="url(#arrow)" />
  <rect x="48" y="910" width="504" height="66" rx="5" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5" />
  <text x="300" y="940" text-anchor="middle" fill="#111827" font-family="Menlo, Consolas, monospace" font-size="26" font-weight="700">10.0.2.14 · 10.0.3.21</text>
  <text x="300" y="965" text-anchor="middle" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="21">Private endpoint ENI addresses</text>

  <text x="24" y="1027" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="21">Example IPs are illustrative. Your endpoint</text>
  <text x="24" y="1054" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="21">ENIs will have different addresses.</text>
</svg>

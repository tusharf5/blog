<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 660" role="img" aria-labelledby="title desc">
  <title id="title">Secrets Manager DNS before and after Private DNS</title>
  <desc id="desc">The same EC2 instance resolves secretsmanager.us-east-1.amazonaws.com. With Private DNS off, the VPC resolver returns a public service address. With Private DNS on, it returns the private addresses of interface endpoint network interfaces, illustrated as 10.0.2.14 and 10.0.3.21.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 22 22" markerWidth="22" markerHeight="22" refX="20" refY="11" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 2 20 11 2 20Z" fill="#374151" />
    </marker>
  </defs>

  <rect width="1100" height="660" fill="#fff" />
  <text x="40" y="53" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700">Same hostname, different DNS answer</text>
  <text x="40" y="85" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="18">One EC2 instance in the VPC makes the same lookup in both cases.</text>

  <rect x="40" y="108" width="1020" height="55" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5" />
  <text x="60" y="143" fill="#111827" font-family="Menlo, Consolas, monospace" font-size="22">secretsmanager.us-east-1.amazonaws.com</text>
  <text x="1037" y="142" text-anchor="end" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="16">lookup</text>

  <rect x="40" y="184" width="490" height="405" rx="8" fill="#fff" stroke="#6b7280" stroke-width="1.7" />
  <rect x="570" y="184" width="490" height="405" rx="8" fill="#fff" stroke="#6b7280" stroke-width="1.7" />
  <path d="M40 237H530 M570 237H1060" stroke="#9ca3af" stroke-width="1.5" />
  <text x="65" y="219" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">Private DNS off</text>
  <text x="595" y="219" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">Private DNS on</text>

  <rect x="65" y="252" width="440" height="45" rx="5" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.3" />
  <rect x="595" y="252" width="440" height="45" rx="5" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.3" />
  <text x="285" y="281" text-anchor="middle" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="20">EC2 client</text>
  <text x="815" y="281" text-anchor="middle" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="20">EC2 client</text>

  <path d="M285 301V365" fill="none" stroke="#374151" stroke-width="3.4" marker-end="url(#arrow)" />
  <path d="M815 301V365" fill="none" stroke="#374151" stroke-width="3.4" marker-end="url(#arrow)" />
  <rect x="65" y="373" width="440" height="45" rx="5" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.3" />
  <rect x="595" y="373" width="440" height="45" rx="5" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.3" />
  <text x="285" y="402" text-anchor="middle" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="20">VPC resolver</text>
  <text x="815" y="402" text-anchor="middle" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="20">VPC resolver</text>

  <path d="M285 422V484" fill="none" stroke="#374151" stroke-width="3.4" marker-end="url(#arrow)" />
  <path d="M815 422V484" fill="none" stroke="#374151" stroke-width="3.4" marker-end="url(#arrow)" />
  <rect x="65" y="492" width="440" height="74" rx="5" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5" />
  <rect x="595" y="492" width="440" height="74" rx="5" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5" />
  <text x="285" y="522" text-anchor="middle" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">Public service address</text>
  <text x="285" y="548" text-anchor="middle" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="16">Normal public DNS answer</text>
  <text x="815" y="522" text-anchor="middle" fill="#111827" font-family="Menlo, Consolas, monospace" font-size="22" font-weight="700">10.0.2.14 · 10.0.3.21</text>
  <text x="815" y="548" text-anchor="middle" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="16">Private addresses of endpoint ENIs</text>

  <text x="40" y="632" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="17">Example IPs are illustrative; your endpoint ENIs will have different addresses.</text>
</svg>
